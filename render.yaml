services:
  - type: web
    name: maktab-shashka
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: cd server && npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: maktab-shashka-db
          property: connectionString

databases:
  - name: maktab-shashka-db
    plan: free
